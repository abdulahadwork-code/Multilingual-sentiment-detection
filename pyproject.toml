[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlmr-sentiment"
version = "1.0.0"
description = "Multilingual (English / Urdu / Roman-Urdu) sentiment classification with fine-tuned XLM-RoBERTa, error analysis and a production REST API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.46",
    "datasets>=2.20",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
xlmr-sentiment = "xlmr_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xlmr_sentiment = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a tiny model from the Hugging Face Hub and trains it (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E501"]  # embedded CSS/HTML
